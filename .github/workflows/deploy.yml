name: CI/CD - Build & Deploy Pullse

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── JOB 1: Testes da Aplicação ──
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, redis
          coverage: none

      - name: Install Backend Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: Prepare Laravel Application
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: Run Backend Tests
        run: |
          cd backend
          php artisan test

  # ── JOB 2: Build & Push das Imagens para o GHCR ──
  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Converte o nome do repositório para minúsculas (exigência do GHCR)
      - name: Lowercase Repository Name
        id: string
        run: |
          echo "repo_name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push: Backend Laravel
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          # Em PR só valida o build das imagens; publica apenas na main
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_name }}/backend:latest
            ghcr.io/${{ steps.string.outputs.repo_name }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      # 2. Build & Push: Nginx Web Server
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/docker/nginx/Dockerfile
          # Em PR só valida o build das imagens; publica apenas na main
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_name }}/nginx:latest
            ghcr.io/${{ steps.string.outputs.repo_name }}/nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      # 3. Build & Push: Frontend Next.js (Otimizado Standalone)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          # Em PR só valida o build das imagens; publica apenas na main
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_name }}/frontend:latest
            ghcr.io/${{ steps.string.outputs.repo_name }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-aulasviolao.bigspacecreative.com.br/api/v1
            NEXT_PUBLIC_SUPPORT_EMAIL=suporte@digitalcourses.com
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  # ── JOB 3: Deploy automático via SSH na VPS (opcional) ──
  # Só roda quando a variável de repositório VPS_AUTO_DEPLOY = 'true'.
  # Sem ela, o pipeline termina após publicar as imagens e o deploy é feito
  # manualmente na VPS com scripts/deploy.sh (ver DEPLOY.md).
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request' && vars.VPS_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ vars.VPS_PROJECT_PATH || '/root/digital-courses' }}
            git pull --ff-only origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            ./scripts/deploy.sh ${{ github.sha }}
